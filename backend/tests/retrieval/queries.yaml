# Labelled retrieval queries (Phase C evaluation; reused by Phase H).
# category: temporal (old/new numbering asked for the other year), plain (no section number),
#           us (treaty and US law), out_of_scope (nothing relevant should be claimed; used by Phase D).
# expect: chunk ids that answer the question; a query is a hit at k if any of them is in the top k.
# Tax years use the start year: 2025 = FY 2025-26 (1961 Act), 2026 = Tax Year 2026-27 (2025 Act).
queries:
  # ---- temporal traps: the number belongs to the other Act
  - {id: T01, category: temporal, year: 2026, q: "What is the 44ADA gross receipts limit?", expect: ["IT2025:s58(2)/T3"]}
  - {id: T02, category: temporal, year: 2026, q: "Is presumptive income under section 44ADA 50% of receipts?", expect: ["IT2025:s58(2)/T3"]}
  - {id: T03, category: temporal, year: 2025, q: "What does section 58(2) Table serial 3 say about professionals?", expect: ["IT1961:s44ADA(1)"]}
  - {id: T04, category: temporal, year: 2026, q: "Do I need to file Form 67 to claim foreign tax credit?", expect: ["FORM44:p1", "RULES2026:r76(10)"]}
  - {id: T05, category: temporal, year: 2025, q: "When is Form 44 due for claiming foreign tax credit?", expect: ["FORM67:p1", "RULES1962:r128(9)"]}
  - {id: T06, category: temporal, year: 2026, q: "Rule 128 foreign tax credit conditions", expect: ["RULES2026:r76(1)"]}
  - {id: T07, category: temporal, year: 2026, q: "section 139(1) due date for filing the return", expect: ["IT2025:s263(1)/T3", "IT2025:s263(1)"]}
  - {id: T08, category: temporal, year: 2025, q: "section 263 return filing due date", expect: ["IT1961:s139(1)"]}
  - {id: T09, category: temporal, year: 2026, q: "Section 87A rebate limit", expect: ["IT2025:s156(2)", "IT2025:s156(1)"]}
  - {id: T10, category: temporal, year: 2025, q: "rebate under section 156", expect: ["IT1961:s87A"]}
  - {id: T11, category: temporal, year: 2026, q: "115BAC new regime slab rates", expect: ["IT2025:s202(1)"]}
  - {id: T12, category: temporal, year: 2026, q: "section 211 advance tax instalment for presumptive income", expect: ["IT2025:s408(2)"]}
  - {id: T13, category: temporal, year: 2026, q: "section 44AB tax audit limit for professionals", expect: ["IT2025:s63(1)/T1", "IT2025:s63(1)"]}
  - {id: T14, category: temporal, year: 2026, q: "Rule 12 ITR-4 eligibility", expect: ["RULES2026:r164(5)", "RULES2026:r164(6)"]}
  - {id: T15, category: temporal, year: 2025, q: "health and education cess rate", expect: ["FA2026:s2(6)"]}
  - {id: T16, category: temporal, year: 2026, q: "health and education cess rate", expect: ["FA2026:s3(15)"]}

  # ---- plain language, no section numbers
  - {id: P01, category: plain, year: 2026, q: "Do I have to keep books of account if I declare 50% of my receipts as profit?", expect: ["CBDT_FAQ_PRES:Q17", "IT2025:s62(1)", "IT2025:s58(3)"]}
  - {id: P02, category: plain, year: 2026, q: "Is information technology a specified profession for presumptive taxation?", expect: ["IT2025:s62(4)"]}
  - {id: P03, category: plain, year: 2025, q: "Is information technology a notified profession under the old Act?", expect: ["NOTIF385E_2001:all", "IT1961:s44AA(1)"]}
  - {id: P04, category: plain, year: 2026, q: "What happens if I declare profit lower than 50 percent of gross receipts?", expect: ["IT2025:s58(3)"]}
  - {id: P05, category: plain, year: 2025, q: "What happens if I declare profit lower than 50 percent of gross receipts?", expect: ["IT1961:s44ADA(4)"]}
  - {id: P06, category: plain, year: 2026, q: "Can a freelancer with income from outside India file ITR-4?", expect: ["RULES2026:r164(6)"]}
  - {id: P07, category: plain, year: 2026, q: "How much can I receive in cash and still use the 75 lakh limit?", expect: ["IT2025:s58(2)/T3"]}
  - {id: P08, category: plain, year: 2025, q: "When must advance tax be paid by someone using presumptive taxation?", expect: ["IT1961:s211(1)"]}
  - {id: P09, category: plain, year: 2026, q: "Which exchange rate converts foreign tax into rupees for the credit?", expect: ["RULES2026:r76(7)"]}
  - {id: P10, category: plain, year: 2026, q: "Can a Hindu undivided family use the presumptive scheme for professions?", expect: ["IT2025:s58(11)"]}
  - {id: P11, category: plain, year: 2026, q: "How is total income rounded off?", expect: ["IT2025:s516"]}
  - {id: P12, category: plain, year: 2025, q: "What is the surcharge when income is above 50 lakh?", expect: ["FA2026:sch1-partIA-paraF/T1"]}
  - {id: P13, category: plain, year: 2026, q: "What are the old regime tax slabs if I opt out?", expect: ["FA2026:sch1-partIB-paraA(I)"]}
  - {id: P14, category: plain, year: 2026, q: "How do I opt out of the new tax regime?", expect: ["RULES2026:r136", "IT2025:s202(4)"]}

  # ---- treaty and US law
  - {id: U01, category: us, year: 2026, q: "Can the US tax me if I stay there for 90 days?", expect: ["DTAA_US:art15(1)"]}
  - {id: U02, category: us, year: 2026, q: "fixed base regularly available in the United States", expect: ["DTAA_US:art15(1)"]}
  - {id: U03, category: us, year: 2026, q: "How does India give credit for US tax under the treaty?", expect: ["DTAA_US:art25(2)"]}
  - {id: U04, category: us, year: 2026, q: "Is my income from US clients US-source if I do the work in India?", expect: ["IRC:s862(a)(3)", "IRC:s861(a)(3)"]}
  - {id: U05, category: us, year: 2026, q: "substantial presence test 183 days", expect: ["IRS_PUB519:spt"]}
  - {id: U06, category: us, year: 2026, q: "How long is a W-8BEN valid?", expect: ["IRS_W8BEN:validity"]}
  - {id: U07, category: us, year: 2026, q: "penalty for not filing Form 8833", expect: ["IRS_PUB901:form8833"]}
  - {id: U08, category: us, year: 2026, q: "Form 8233 exemption from withholding for independent personal services", expect: ["IRS_F8233:p1"]}
  - {id: U09, category: us, year: 2026, q: "treaty exemption for Indian residents performing personal services in the US", expect: ["IRS_PUB901:india", "DTAA_US:art15(1)"]}
  - {id: U10, category: us, year: 2026, q: "Do I need GST registration if my export turnover is over 20 lakh?", expect: ["CGST:s22(1)", "CGST:s2(6)"]}

  # ---- out of scope (no expected chunk; Phase D should decline)
  - {id: O01, category: out_of_scope, year: 2026, q: "What is the GST rate on restaurant food?", expect: []}
  - {id: O02, category: out_of_scope, year: 2026, q: "How is HRA exemption calculated for salaried employees?", expect: []}
