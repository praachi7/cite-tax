  - {id: H-U03, category: us, year: 2026, q: "Does furnishing services in the US for more than 90 days create a permanent establishment?", expect: ["DTAA_US:art5(2)"]}
  - {id: H-U04, category: us, year: 2026, q: "What rate does the treaty allow on fees for included services?", expect: ["DTAA_US:art12(2)"]}
  - {id: H-U05, category: us, year: 2026, q: "What is the penalty for not disclosing a treaty position with Form 1040-NR?", expect: ["IRS_1040NR:treaty_disclosure", "IRS_PUB901:form8833"]}
