id: P4
title: Rs 60 lakh receipts with 8% cash, Tax Year 2026-27; the limit falls to Rs 50 lakh so presumptive taxation is unavailable
# Hand computation (Income-tax Act 2025):
#   cash = 4,80,000 of 60,00,000 = 8% > 5%, so the limit stays Rs 50 lakh; 60L exceeds it -> scheme unavailable
#   income must come from books of account: assume books profit of Rs 33,00,000 (55%)          [input]
#   receipts exceed Rs 50 lakh and the person is not declaring under s.58(2) -> tax audit, s.63(1) Sl.1(c)
#   slabs: 3,00,000 (to 24L, as in P3) + 2,70,000 (9L at 30%) = 5,70,000                        [s.202(1)]
#   cess 22,800; payable 5,92,800
#   Old regime: 12,500 + 1,00,000 + 6,90,000 = 8,02,500; cess 32,100; 8,34,600
