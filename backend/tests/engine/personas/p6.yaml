id: P6
title: Remote work only, no W-8BEN, 30% withheld, Tax Year 2026-27; tests the refund route and that the tax is not creditable
# Receipts Rs 40 lakh, all done from India for a US client. No Form W-8BEN was given, so the client withheld
# 30% of the whole amount: Rs 12,00,000. US days in 2026: 0.
# Hand computation:
#   source: services performed in India are not US-source                                          [IRC s.861(a)(3), s.862(a)(3)]
#   so the US has no right to tax it and the treaty is never reached                               [Art. 15]
#   the withholding is not creditable in India; it is claimed back from the US on Form 1040-NR,
#   and a valid W-8BEN stops further withholding                                                   [Form 1040-NR, W-8BEN]
#   India: deemed income 20,00,000; payable 2,08,000 as in P5; no credit, so advance tax 2,08,000
#   ITR: A-16 default bars ITR-4 (contested); no other bar -> ITR-3, ITR-4 possible under reading a
input:
  persona_id: P6
  tax_year: 2026
  receipts: {electronic: 4000000}
  engagements:
    - {label: US client, country_of_performance: IN, amount_inr: 4000000, client_is_us_person: true, w8ben_on_file: false, us_tax_withheld_inr: 1200000}
  us_days_by_year: {2026: 0}
