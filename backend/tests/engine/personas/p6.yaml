  relief.refunds.0.forms: {value: ["Form 1040-NR", "Form W-8BEN"], cite: ["IRS_1040NR:all", "IRS_W8BEN:withholding"], work: "1040-NR for the refund; W-8BEN to stop withholding."}
  relief.ftc: {value: null, cite: ["RULES2026:r76(7)(a)"], work: "No foreign tax was properly payable, so no credit is claimed."}
