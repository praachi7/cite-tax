  regime.withdrawal_this_year: {value: true, cite: ["IT2025:s202(4)(a)(iii)"], work: "Old in 2025, new in 2026."}
  regime.opt_out_barred_after: {value: true, cite: ["IT2025:s202(4)(a)(iv)"], work: "No second opt-out."}
  regime.filing: {value: return_of_income, cite: ["RULES2026:r136"], work: "No separate form: the return carries the election."}
  income.income: {value: 2000000, cite: ["IT2025:s58(2)/T3"], work: "50% of 40,00,000."}
  india_tax.in_force.slab_tax: {value: 200000, cite: ["IT2025:s202(1)"], work: "20,000 + 40,000 + 60,000 + 80,000."}
