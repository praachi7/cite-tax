id: P8
title: A past old-regime opt-out, Tax Year 2026-27; tests the election rules across both Acts
# The taxpayer used the old regime in 2024 and 2025 (FY 2024-25 and FY 2025-26, the second under the 1961 Act)
# and now returns to the new regime in Tax Year 2026-27 under the 2025 Act. Receipts Rs 40 lakh, all electronic.
#   withdrawal of the opt-out: old -> new, the one allowed switch back                     [s.202(4)(a)(iii)]
#   after it no further opt-out is allowed while business income continues                [s.202(4)(a)(iv)]
#   no Form 10-IEA: the option is exercised or withdrawn in the return of income           [r.136, RULES2026]
#   deemed income = 20,00,000; slabs 20,000 + 40,000 + 60,000 + 80,000 = 2,00,000          [s.202(1)]
#   cess 8,000; payable 2,08,000. Old regime: 12,500 + 1,00,000 + 3,00,000 = 4,12,500; cess 16,500; 4,29,000
input:
  persona_id: P8
  tax_year: 2026
  receipts: {electronic: 4000000}
  regime_choice: new
  election_history:
    - {tax_year: 2024, regime: old}
    - {tax_year: 2025, regime: old}
expected:
