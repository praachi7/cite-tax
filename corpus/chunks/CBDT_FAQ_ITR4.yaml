  heading: 3. What are the key changes in ITR-4 form for AY 2026-27?
  text: |-
    3. What are the key changes in ITR-4 form for AY 2026-27?
    Below are the key Changes in ITR-4 for AY 2026-27:
    ●​ Two House Properties: Taxpayers can now report income from up to two house
    properties in ITR-4, rather than just one house property.
    ●​ Unrealised Rent Field: A new, specific field for "rent which cannot be realised" has been
    added, aiding taxpayers with rented properties.
    ●​ Foreign Asset Reporting: Requirements for reporting foreign retirement benefits have
    been removed.
