- id: CBDT_FAQ_ITR4:Q28
  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q28 > FY 2025-26
  heading: 28. What additional information I must furnish in ITR-4 form if I am claiming deductions u/s 80DD
  text: |-
    28. What additional information I must furnish in ITR-4 form if I am claiming deductions u/s 80DD
    Or 80U?
    You must give additional information regarding deduction u/s 80DD or Section 80U. If you want
    to claim deduction u/s 80DD or 80U, then you must enter the details below:
    ●​ Nature Of Disability
    ●​ Type of Disability
    ●​ Type of Dependent
    ●​ Amount of Deduction
    ●​ PAN of Dependent
    ●​ Aadhaar of Dependent
    ●​ Acknowledgement no. of form 10 IA filed
  tax_year_first: 2025
  tax_year_last: 2025
  authority_rank: 4
  pdf_pages:
  - 7
  extraction: auto
