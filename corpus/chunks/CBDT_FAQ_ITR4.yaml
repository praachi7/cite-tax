- id: CBDT_FAQ_ITR4:Q30
  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q30 > FY 2025-26
  heading: 30. Do I need to give additional information if I am claiming deductions u/s 80E, 80EE, 80EEA &
  text: |-
    30. Do I need to give additional information if I am claiming deductions u/s 80E, 80EE, 80EEA &
    80EEB?
    You must give additional information regarding deduction u/s 80E, 80EE ,80EEA and 80EEB. If
    you want to claim a deduction under these sections, then you must enter the details below:
    ●​ Loan taken from
    ●​ Name of the institution or bank
    ●​ Loan Account No.
    ●​ Date of sanction of loan
    ●​ Total Amount of loans
    ●​ Loan outstanding as on date
    ●​ Interest amount
  tax_year_first: 2025
  tax_year_last: 2025
