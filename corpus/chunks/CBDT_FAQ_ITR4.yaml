- id: CBDT_FAQ_ITR4:Q18
  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q18 > FY 2025-26
  heading: 18. How do I compute income from a house property which is partly self-occupied and partly
  text: |-
    18. How do I compute income from a house property which is partly self-occupied and partly
    let-out?
    House Property may consist of two or more independent units, one of which is self-occupied,
    and the remaining is used for any other purpose (i.e., let-out or used for own business). Income
    from such property will be computed in the following manner:
    1.​ Part / unit which is occupied by you for your residence throughout the year will be treated
    as an independent property and income from such a part / unit will be computed in the
    manner as described in the ITR-4 user manual in case of a self-occupied property.
    2.​ Part / unit which is let out will be treated as an independent property and income from
    such a part/unit will be computed in the manner as described in the ITR-4 user manual in
    case of let out property. ​
    Please Note: From AY 2026-27, you can disclose income from up to two house properties, in
    ITR-4.
  tax_year_first: 2025
  tax_year_last: 2025
