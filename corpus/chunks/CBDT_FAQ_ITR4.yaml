  heading: 25. What happens if I file Income Tax Return after the due date u/s 139(1)?
  text: |-
    25. What happens if I file Income Tax Return after the due date u/s 139(1)?
    In case you miss filing the ITR within the due date u/s 139(1), you can still file your Income Tax
    Return, but you may be required to pay a late filing fee of up to ₹5000/-. Additionally, you will also
    be required to pay interest on the tax liability (if any).
