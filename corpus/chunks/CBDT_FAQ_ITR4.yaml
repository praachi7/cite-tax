  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q10 > FY 2025-26
  heading: 10. What is the Threshold limit to opt for the presumptive taxation scheme under section 44AD &
  text: |-
    10. What is the Threshold limit to opt for the presumptive taxation scheme under section 44AD &
    Section 44ADA?
    The threshold limit of turnover under Section 44AD is Rs.3 crore (if the sum of amount or
    aggregate of the amounts received during the previous year, in cash and in any other mode, does
    not exceed 5% of the total gross receipts of such previous year) and Rs.2 crores otherwise.
    The threshold limit under Section 44ADA limit is Rs.75lakh (if sum of the amount or aggregate of
    the amounts received during the previous year, in cash and in any other mode, does not exceed
    5% of the total gross receipts of such previous year) and Rs.50 lakhs otherwise.
  tax_year_first: 2025
