  heading: 1. Who is eligible to file ITR-4 for AY 2026-27?
  text: |-
    1. Who is eligible to file ITR-4 for AY 2026-27?
    ITR-4 can be filed by a Resident Individual / HUF / Firm (other than LLP) who has:
    ●​ Income not exceeding ₹50 Lakh during the FY
    ●​ Income from Business and Profession which is computed on a presumptive basis u/s
    44AD, 44ADA or 44AE
    ●​ Long-term capital gain u/s 112A not exceeding Rs.1.25 lakhs
    ●​ Income from Salary/Pension, Two House Property, Agricultural Income (up to ₹ 5000/-)
    ●​ Other Sources which include (excluding winning from Lottery and Income from
    Racehorses):
    ○​ Interest from Savings Account
    ○​ Interest from Deposit (Bank / Post Office / Cooperative Society)
    ○​ Interest from Income Tax Refund
    ○​ Family Pension
    ○​ Any other Interest Income (e.g., Interest Income from Unsecured Loan)
