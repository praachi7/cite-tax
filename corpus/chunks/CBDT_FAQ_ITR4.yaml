    If you want to claim deduction u/s 80DD and 80U then you must mandatorily file from 10 IA
    before filing the return of Income and enter the details (Date of filing form and acknowledgement
    no.) of Form 10 IA in Schedule 80DD and 80U while filing the return of Income.
