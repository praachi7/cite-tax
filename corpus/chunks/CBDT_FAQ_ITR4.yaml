  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q15 > FY 2025-26
  heading: 15. I opted for the presumptive income scheme of Section 44ADA. Do I have to pay Advance Tax
  text: |-
    15. I opted for the presumptive income scheme of Section 44ADA. Do I have to pay Advance Tax
    in respect of income from profession covered in Section 44ADA?
    Yes. Anyone opting for the presumptive taxation scheme u/s 44ADA is liable to pay 100% of
    Advance Tax on or before 15th March of the previous year. If you fail to pay the Advance Tax by
    15th March of previous year, you will be liable to pay interest as per Section 234B and Section
    234C​. Any amount paid by way of Advance Tax on or before 31st March will also be treated as
    Advance Tax paid during the FY ending on that day.
  tax_year_first: 2025
  tax_year_last: 2025
  authority_rank: 4
