  heading: 14. I opted for presumptive income scheme of Section 44AD or 44ADA. Can I claim further
  text: |-
    14. I opted for presumptive income scheme of Section 44AD or 44ADA. Can I claim further
    deduction of expenses after declaring profit at applicable rate under respective sections of gross
    receipts?
    No, a person who opted for the presumptive taxation scheme is deemed to have claimed all
    deduction of expenses. Any further claim of deduction is not allowed after declaring profit at
    specified rate. However, you can claim deductions under Chapter VI-A​.
