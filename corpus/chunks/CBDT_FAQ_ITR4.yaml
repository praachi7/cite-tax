  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q8 > FY 2025-26
  heading: 8. What documents do I need to file ITR-4? Is it necessary to link Aadhaar with PAN to file ITR?
  text: |-
    8. What documents do I need to file ITR-4? Is it necessary to link Aadhaar with PAN to file ITR?
    You will need to keep the below documents ready (as applicable) to file ITR-4:
    ●​ Form 16
    ●​ Form 16A
    ●​ Form 26AS
    ●​ AIS
    ●​ Pay Slip
    ●​ Bank Statements
    ●​ Housing Loan Interest Certificates
    ●​ House rent receipt (if applicable),
    ●​ Rental Agreement
    ●​ Receipts for Donation Made
    ●​ Investment, premium payment receipts - LIC, ULIP etc. and other relevant Documents to
    furnish information in ITR form.
    Linking of Aadhaar and PAN is important. However, you would still be able to file your ITR if your
    PAN is not linked with Aadhaar, but you will have limited access on the portal. It is therefore
    advisable to link PAN with Aadhaar.
