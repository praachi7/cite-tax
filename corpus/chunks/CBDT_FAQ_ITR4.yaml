  heading: 27. Do I need to give additional information if I am claiming deductions u/s 80CCD(1) or
  text: |-
    27. Do I need to give additional information if I am claiming deductions u/s 80CCD(1) or
    80CCD(1B)?
    You must give additional information regarding deduction u/s 80CCD(1) or 80CCD(1B). If you
    want to claim these deductions, then you must enter the PRAN by clicking on PRAN tab.
