- id: CBDT_FAQ_ITR4:Q13
  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q13 > FY 2025-26
  heading: 13. Who can opt for presumptive taxation scheme of Section 44ADA?
  text: |-
    13. Who can opt for presumptive taxation scheme of Section 44ADA?
    The presumptive taxation scheme of Section 44ADA​can be adopted by an assessee being
    individual or partnership firm (other than LLP) and resident in India carrying on specified
    profession whose gross receipts do not exceed ₹ 50 Lakh in a FY.
    Provided that in case the amount or aggregate of the amounts received during the previous year,
    in cash, does not exceed five per cent of the total gross receipts of such previous year, then the
    limit is up to 75 Lakh in a FY.
    Following professions are specified professions:
    ●​ Legal​
    ●​ Medical
    ●​ Engineering or Architectural
    ●​ Accountancy
    ●​ Technical Consultancy
    ●​ Interior Decoration
    ●​ Any other Profession as notified by CBDT
