  heading: 4. I am an individual with a business income can I opt for old tax regime while filing ITR-4?
  text: |-
    4. I am an individual with a business income can I opt for old tax regime while filing ITR-4?
    Yes, you can opt for old tax regime if you have business income but to opt for the old Tax regime
    you must file Form 10 IEA before the due date of filing the ITR u/s 139(1) of the Income Tax Act,
    1961.
