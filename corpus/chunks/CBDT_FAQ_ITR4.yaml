- id: CBDT_FAQ_ITR4:Q9
  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q9 > FY 2025-26
  heading: 9. What is the presumptive taxation scheme for users filing ITR-4?
  text: |-
    9. What is the presumptive taxation scheme for users filing ITR-4?
    According to Sections 44AA of the Income Tax Act ,1961, a person engaged in business or
    profession needs to maintain regular books of accounts under certain circumstances as per
    specific conditions. To relieve small taxpayers from such compliance burden, the Income Tax Act
    has framed the presumptive taxation scheme u/s 44AD, 44ADA and 44AE. A person adopting the
    presumptive taxation scheme can declare income at a prescribed rate. ​The Act has laid out
    presumptive taxation schemes (for ITR-4 users) as given below:
    ●​ Section 44AD: Computation of income on estimated basis in the case of taxpayers
    (being a Resident Individual, Resident HUF, or Resident Partnership Firm (other than
    LLP) engaged in certain business subject to certain conditions.
    ●​ Section 44ADA: Computation of professional income on estimated basis for Assessee
    being a resident in India and engaged in a profession referred to in section 44AA (1)
    subject to certain conditions.
    ●​ Section 44AE: Computation of income on estimated basis in the case of taxpayers
    (being an Individual, HUF, Firm (other than LLP) or any other person being a resident or
    non-resident) engaged in the business of plying, leasing or hiring goods carriages, who
    owns not more than ten goods carriages at any time during the previous year.
  tax_year_first: 2025
  tax_year_last: 2025
  authority_rank: 4
