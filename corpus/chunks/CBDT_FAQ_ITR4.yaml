- id: CBDT_FAQ_ITR4:Q31
  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q31 > FY 2025-26
  heading: 31. Do I need to file any form if I am claiming deduction u/s 80GG?
  text: |-
    31. Do I need to file any form if I am claiming deduction u/s 80GG?
    If you want to claim deduction u/s 80GG then you must mandatorily file Form 10 BA before filing
    the return of Income and enter the details (acknowledgement no.) of Form 10 BA in Schedule
    80GG while filing the return of Income.
  tax_year_first: 2025
  tax_year_last: 2025
