- id: CBDT_FAQ_ITR4:Q11
  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q11 > FY 2025-26
  heading: 11. Who is not eligible for the presumptive taxation scheme of Section 44AD?
  text: |-
    11. Who is not eligible for the presumptive taxation scheme of Section 44AD?
    The scheme of Section 44AD is designed to give relief to small taxpayers engaged in any
    business, except the following businesses:
    ●​ Business of plying, hiring, or leasing goods carriages referred to in sections 44AE
    ●​ A person carrying on any agency business
    ●​ A person earning income in the form of commission or brokerage (e.g., insurance agents)
    ●​ Any business whose total turnover or gross receipts exceeds ₹ 2 Crore
    ●​ Any business whose total turnover or gross receipts exceeds ₹ 3 Crore (₹ 3 Crore
    applicable for case where amount or aggregate of the amounts received during the
    previous year, in cash and any other mode, does not exceed 5% of the total gross
    receipts of such previous year)
    Apart from the above, a person who is required to maintain books of accounts as referred to in
    Section 44AA (1) i​s not eligible for presumptive taxation scheme u/s 44AD.
  tax_year_first: 2025
  tax_year_last: 2025
  authority_rank: 4
