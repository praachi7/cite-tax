  heading: 16. I opted for presumptive taxation scheme of Section 44ADA. Do I need to maintain books of
  text: |-
    16. I opted for presumptive taxation scheme of Section 44ADA. Do I need to maintain books of
    accounts as per Section 44AA?
    If you are engaged in a specified profession as referred in Sections 44AA (1)​ and opt for
    presumptive taxation scheme of Section 44ADA (declare income @50% of the gross receipts),
    you are not required to maintain the books of accounts in respect of specified profession (i.e.,
    the provision of Sections 44AA will not apply).
