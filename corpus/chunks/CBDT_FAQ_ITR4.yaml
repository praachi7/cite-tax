- id: CBDT_FAQ_ITR4:Q21
  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q21 > FY 2025-26
  heading: 21. Can my employer PAN be quoted in place of TAN?
  text: |-
    21. Can my employer PAN be quoted in place of TAN?
    No. PAN should never be quoted in the textbox where TAN is to be quoted, as the purposes for
    which PAN and TAN are allotted are different. TAN is a unique identification number which is
    allotted to parties who deduct or collect tax at source. PAN is a unique identification number
    issued to keep a linking of the transactions carried by a person like payment of tax, TDS / TCS
    credit, Return of Income, Return of Wealth, correspondence with the Income Tax Department or
    correspondence by the ITD, investments made by a person, loan taken by a person, etc.
  tax_year_first: 2025
