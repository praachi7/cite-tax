- id: CBDT_FAQ_ITR4:Q5
  source_id: CBDT_FAQ_ITR4
  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q5 > FY 2025-26
  heading: 5. I am an individual with a business income can I switch between new tax regime and old tax
  text: |-
    5. I am an individual with a business income can I switch between new tax regime and old tax
    regime every year?
    Individuals having business income are not eligible to choose between the new and old tax
    regimes every year. Once they have opted for the old tax regime, they only have a one-time option
    of switching back to the new tax regime in their lifetime. Once they switch back, they cannot opt
    for the old tax regime again.
    Essentially, people with business income must file Form 10-IEA twice, once to use the old tax
    regime and the second to switch back to the new regime.
  tax_year_first: 2025
  tax_year_last: 2025
