  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q29 > FY 2025-26
  heading: 29. Do I need to give additional information if I am claiming deductions u/s 80D?
  text: |-
    29. Do I need to give additional information if I am claiming deductions u/s 80D?
    You must give additional information regarding deduction u/s 80D. If you want to claim
    deduction u/s 80D, then you must enter the details below:
    ●​ Name of the Insurer (Insurance Company)
    ●​ Policy Number
    ●​ Health Insurance amount
