  breadcrumb: e-Filing FAQs on ITR-4, AY 2026-27 > Q20 > FY 2025-26
  heading: 20. What is the tax treatment of unrealized rent that is subsequently realized?
  text: |-
    20. What is the tax treatment of unrealized rent that is subsequently realized?
    Any subsequent recovery of unrealized rent will be deemed to be your income under the head
    Income from House Property in the year in which such rent is realized (whether or not you are the
    owner of that property in that year).​It will be charged to tax after deducting a sum equal to 30%
    of unrealized rent.​
