    [भाग II—खण्ड 3(i)] भारत का रािपत्र : असाधारण 75
    MINISTRY OF FINANCE
    (Department of Revenue)
    (CENTRAL BOARD OF DIRECT TAXES)
    NOTIFICATION
    New Delhi, the 30th March, 2026
    G.S.R. 228(E).—In exercise of the powers conferred by section 139 read with section 295 of the Income-tax
    Act, 1961 (43 of 1961), the Central Board of Direct Taxes hereby makes the following rules further to amend Income-
    tax Rules, 1962, namely: -
    1. (1) These rules may be called the Income-tax (Fourth Amendment) Rules, 2026;
    (2) They shall come into force with effect from the 31st day of March, 2026 and shall apply in respect of returns
    filed for A.Y. 2026-27.
    2. In the Income-tax Rules, 1962, in Appendix II, for FORM ITR-3, the following FORM shall be
    substituted, namely: –––
    FORM ITR- INDIAN INCOME TAX RETURN Assessment Year
