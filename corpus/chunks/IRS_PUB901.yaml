- id: IRS_PUB901:india
  source_id: IRS_PUB901
  breadcrumb: IRS Publication 901 > India (personal services)
  heading: 'India: treaty exemption for personal services income'
  text: |-
    India
    Income that residents of India receive for performing personal services in the United States during the tax year as independent contractors or self-employed individuals (independent personal services) is exempt from U.S. income tax if the residents:
    • Are present in the United States for no more than 89
    days during the tax year, and
    • Do not have a fixed base regularly available to them in
    the United States for performing the services.
    If they have a fixed base available, they are taxed only on income attributable to the fixed base.
    Income that residents of India receive for personal services performed in the United States as employees (dependent personal services) is exempt from U.S. income tax if the residents meet the following requirements.
    • They are present in the United States for no more than
    183 days during the tax year.
    • The income is paid by, or on behalf of, an employer
    who is not a resident of the United States.
    • The income is not borne by a permanent establish-
    ment, fixed base, or trade or business the employer has in the United States.
    This exemption does not apply to pay received by a resident of India for services performed as an employee aboard a ship or an aircraft operated in international traffic by a U.S. enterprise.
    These exemptions do not apply to directors' fees and similar payments received by an Indian resident as a member of the board of directors of a company that is a U.S. resident.
    These exemptions do not apply to income residents of India receive as entertainers (such as theater, motion picture, radio, or television artists; or musicians) or athletes if their net income is more than $1,500 during the tax year for their entertainment or athletic activities in the United States. Regardless of this limit, the income of Indian entertainers or athletes is exempt from U.S. tax if their visit to the United States is wholly or substantially supported from the public funds of the Indian Government or its political subdivisions or local authorities.
  tax_year_first: null
