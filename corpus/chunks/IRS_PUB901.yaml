- id: IRS_PUB901:form8833
  source_id: IRS_PUB901
  breadcrumb: IRS Publication 901 > Treaty-based position disclosure
  heading: Disclosing a treaty-based position on Form 8833
  text: |-
    Disclosure of a treaty-based position that reduces your tax. If you take the position that any U.S. tax is overruled or otherwise reduced by a U.S. treaty (a treaty-based position), you must generally disclose that position on Form 8833 and attach it to your return. If you are not required to file a return because of your treaty-based position, you must file a return anyway to report your position. The filing of Form 8833 does not apply to a reduced rate of withholding tax on noneffectively connected income, such as dividends, interest, rents, or royalties, or to a reduced rate of tax on pay received for services performed as an employee, including pensions, annuities, and social security. For more information, see Pub. 519 and the Form 8833 instructions.
    If you fail to file Form 8833, you may have to pay a $1,000 penalty. Corporations are subject to a $10,000 penalty for each failure.
