- id: IT2025:s160(3)
  source_id: IT2025
  breadcrumb: Income-tax Act 2025 > s.160(3) > Tax Year 2026-27 onward
  heading: Countries with which no agreement exists
  text: |-
    (3) For the purposes of this section,—
    (a) “income-tax” in relation to any country includes any excess profits tax
    or business profits tax charged on the profits by the Government of any
    part of that country or a local authority in that country;
    (b) “Indian income-tax” means income-tax charged as per this Act;
    (c) “Indian rate of tax” means the rate determined by dividing Indian
    income-tax after deduction of any relief due under the provisions of this
    Act but before deduction of any relief due under this Part, by the total
    income; and
    (d) “rate of tax of the said country” means income-tax and super-tax actually
    paid in the said country as per the corresponding laws in force in the
    said country after deduction of all relief due, but before deduction of
    any relief due in the said country in respect of double taxation, divided
    by the whole amount of the income as assessed in the said country.
    CHAPTER X
    SPECIAL PROVISIONS RELATING TO AVOIDANCE OF TAX
