  heading: 'Presumptive taxation, Table Sl. 2: plying, hiring or leasing goods carriages'
  text: |-
    Section 58(2), Table, Sl. No. 2.
    Column B (specified business or profession): Business of plying, hiring or leasing goods carriages.
    Column C (assessee): An assessee who owns not more than ten goods carriages at any time during the tax year.
    Column D: no turnover limit is stated for this row.
    Column E (manner of computation): (A) the aggregate of income from goods carriages: (i) for a heavy goods vehicle, ₹1,000 per ton of gross vehicle weight or unladen weight, as the case may be, for each vehicle, for every month or part of a month during which the vehicle is owned by the assessee in the tax year; (ii) for a vehicle other than a heavy goods vehicle, ₹7,500 for each goods carriage for every month or part of a month during which the vehicle is owned by the assessee in the tax year; or (B) profit claimed to have been actually earned, whichever is higher.
