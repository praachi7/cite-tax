  breadcrumb: Income-tax Act 2025 > s.63(1) Table Sl. 1 > Tax Year 2026-27 onward
  heading: 'Tax audit, Table Sl. 1: turnover and gross receipts limits'
  text: |-
    Section 63(1): every person carrying on business or profession fulfilling any of the conditions in column B of the Table shall get the accounts of the tax year audited by an accountant before the specified date.
    Table, Sl. No. 1. Every person—
    (a) carrying on business, if total sales, turnover or gross receipts in business exceed one crore rupees in any tax year, subject to clause (b);
    (b) where (i) the aggregate of all amounts received in cash during the tax year does not exceed 5% of that amount, and (ii) the aggregate of all payments made in cash during the tax year does not exceed 5% of those payments, clause (a) applies as if for "one crore rupees" the words "ten crore rupees" were substituted;
    (c) carrying on profession, if gross receipts in profession exceed fifty lakh rupees in any tax year.
    Table, Sl. No. 2: a person carrying on business or profession referred to in section 58(2) or 61(2) whose profits are claimed to be lower than the deemed profits (see the auto chunk IT2025:s63(1)).
