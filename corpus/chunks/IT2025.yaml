  source_id: IT2025
  breadcrumb: Income-tax Act 2025 > s.160(2) > Tax Year 2026-27 onward
  heading: Countries with which no agreement exists
  text: |-
    (2) If any non-resident person is assessed on his share in the income of a registered
    firm assessed as resident in India in any tax year and such share includes any income
    accruing or arising outside India during that tax year (and which is not deemed
    to accrue or arise in India) in a country with which there is no agreement under
    section 159 for the relief or avoidance of double taxation and he proves that he has
    paid income-tax by deduction or otherwise under the law in force in that country
    in respect of the income so included he shall be entitled to a deduction from the
    Indian income-tax payable by him of a sum calculated on such doubly taxed income
    so included,—
    (a) at the Indian rate of tax or the rate of tax of the said country, whichever
    is the lower; or
    (b) at the Indian rate of tax if both the rates are equal.
