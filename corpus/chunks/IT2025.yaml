- id: IT2025:s160(1)
  source_id: IT2025
  breadcrumb: Income-tax Act 2025 > s.160(1) > Tax Year 2026-27 onward
  heading: Countries with which no agreement exists
  text: |-
    160. (1) If any person who is resident in India in any tax year proves that, in
    respect of his income which accrued or arose during that tax year outside
    India (and which is not deemed to accrue or arise in India), he has paid in any coun-
    try with which there is no agreement under section 159 for the relief or avoidance
    of double taxation, income-tax, by deduction or otherwise, under the law in force
    in that country, he shall be entitled to the deduction from the Indian income-tax
    payable by him of a sum calculated on such doubly taxed income,—
    (a) at the Indian rate of tax or the rate of tax of the said country, whichever
    is the lower; or
    (b) at the Indian rate of tax if both the rates are equal.
  tax_year_first: 2026
