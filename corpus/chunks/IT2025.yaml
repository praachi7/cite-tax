- id: IT2025:s58(2)/T1
  source_id: IT2025
  breadcrumb: Income-tax Act 2025 > s.58(2) Table Sl. 1 > Tax Year 2026-27 onward
  heading: 'Presumptive taxation, Table Sl. 1: any business (6% / 8%)'
  text: |-
    Section 58(2), Table, Sl. No. 1.
    Column B (specified business or profession): Any business other than the business specified against serial number 2.
    Column C (assessee): Eligible assessee.
    Column D (total turnover or gross receipts during the tax year): (a) does not exceed two crore rupees; or (b) does not exceed three crore rupees, where the amount or aggregate of amounts received, in cash, does not exceed 5% of the total turnover or gross receipts.
    Column E (manner of computation): (A) the aggregate of (i) 6% of total turnover or gross receipts which is received by specified banking or online mode during the tax year or before the due date specified in section 263(1) in respect of that tax year; and (ii) 8% of total turnover or gross receipts as reduced by the turnover or gross receipts covered in (i); or (B) profit claimed to have been actually earned, whichever is higher.
