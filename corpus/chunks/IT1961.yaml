- id: IT1961:s44AD(1)
  source_id: IT1961
  breadcrumb: Income-tax Act 1961 > s.44AD(1) > FY 2025-26 and earlier
  heading: Special provision for computing profits and gains of business on presumptive basis
  text: |-
    44AD. (1) Notwithstanding anything to the contrary contained in sections 28
    to 43C, in the case of an eligible assessee engaged in an eligible business,
    a sum equal to eight per cent of the total turnover or gross receipts of the assessee
    in the previous year on account of such business or, as the case may be, a sum
    higher than the aforesaid sum claimed to have been earned by the eligible
    assessee, shall be deemed to be the profits and gains of such business chargeable
    to tax under the head “Profits and gains of business or profession” :
    Provided that this sub-section shall have effect as if for the words “eight per cent”,
    the words “six per cent” had been substituted, in respect of the amount of total
    turnover or gross receipts which is received by an account payee cheque or an
    account payee bank draft or use of electronic clearing system through a bank
    account or through such other electronic mode as may be prescribed during the
    previous year or before the due date specified in sub-section (1) of section 139
    in respect of that previous year.
