- id: IT1961:s44ADA(1)
  source_id: IT1961
  breadcrumb: Income-tax Act 1961 > s.44ADA(1) > FY 2025-26 and earlier
  heading: Special provision for computing profits and gains of profession on presumptive basis
  text: |-
    44ADA. (1) Notwithstanding anything contained in sections 28 to 43C, in
    case of an assessee, being an individual or a partnership firm other
    than a limited liability partnership as defined under clause (n) of sub-section (1)
    of section 2 of the Limited Liability Partnership Act, 2008 (6 of 2009), who is a
    resident in India, and is engaged in a profession referred to in sub-section (1) of
    section 44AA and whose total gross receipts do not exceed fifty lakh rupees in a
    previous year, a sum equal to fifty per cent of the total gross receipts of the
    assessee in the previous year on account of such profession or, as the case may
    be, a sum higher than the aforesaid sum claimed to have been earned by the
    assessee, shall be deemed to be the profits and gains of such profession charge-
    able to tax under the head “Profits and gains of business or profession”:
    Provided that in case of an assessee where the amount or aggregate of the
    amounts received during the previous year, in cash, does not exceed five per cent
    of the total gross receipts of such previous year, this sub-section shall have effect
    as if for the words “fifty lakh rupees”, the words “seventy-five lakh rupees” had
    been substituted:
    Provided further that for the purposes of the first proviso, the receipt of amount
    or aggregate of amounts by a cheque drawn on a bank or by a bank draft, which
    is not account payee, shall be deemed to be the receipt in cash.
