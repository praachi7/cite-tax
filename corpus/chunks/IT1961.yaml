    assessment year, of an amount equal to hundred per cent of such income-tax or
    an amount of twelve thousand and five hundred rupees, whichever is less:
    Provided that where the total income of the assessee is chargeable to tax under
    sub-section (1A) of section 115BAC, and the total income—
    twelve (a) does not exceed 2[ ] hundred thousand rupees, the assessee shall
    be entitled to a deduction from the amount of income-tax (as com-
    puted before allowing for the deductions under this Chapter) on his
    total income with which he is chargeable for any assessment year, of
    an amount equal to one hundred per cent of such income-tax or an
    sixty amount of 3[
