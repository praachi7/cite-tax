- id: IT1961:s91(1)
  source_id: IT1961
  breadcrumb: Income-tax Act 1961 > s.91(1) > FY 2025-26 and earlier
  heading: Countries with which no agreement exists
  text: |-
    91. (1) If any person who is resident in India in any previous year proves that, in
    respect of his income which accrued or arose during that previous year
    outside India (and which is not deemed to accrue or arise in India), he has paid
    in any country with which there is no agreement under section 90 for the relief
    or avoidance of double taxation, income-tax, by deduction or otherwise, under
    the law in force in that country, he shall be entitled to the deduction from the
    Indian income-tax payable by him of a sum calculated on such doubly taxed
    income at the Indian rate of tax or the rate of tax of the said country, whichever
    is the lower, or at the Indian rate of tax if both the rates are equal.
