    are liable to pay the same, in four instalments during each financial
    year and the due date of each instalment and the amount of such
    instalment shall be as specified in the Table below:
    TABLE
    Due date of instalment Amount payable
    On or before the 15th Not less than fifteen per cent of such advance
    June tax.
    Due date of instalment Amount payable
    On or before the 15th Not less than forty-five per cent of such
    September advance tax, as reduced by the amount, if any,
    paid in the earlier instalment.
    On or before the 15th Not less than seventy-five per cent of such
    December advance tax, as reduced by the amount or
