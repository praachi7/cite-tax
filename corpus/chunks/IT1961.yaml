- id: IT1961:s90(5)
  source_id: IT1961
  breadcrumb: Income-tax Act 1961 > s.90(5) > FY 2025-26 and earlier
  heading: Agreement with foreign countries or specified territories
  text: |-
    (5) The assessee referred to in sub-section (4) shall also provide such other
    documents and information, as may be prescribed.
    Explanation 1.—For the removal of doubts, it is hereby declared that the charge
    of tax in respect of a foreign company at a rate higher than the rate at which a
    domestic company is chargeable, shall not be regarded as less favourable charge
    or levy of tax in respect of such foreign company.
    Explanation 2.—For the purposes of this section, “specified territory” means any
    area outside India which may be notified as such by the Central Government.
    Explanation 3.—For the removal of doubts, it is hereby declared that where any
    term is used in any agreement entered into under sub-section (1) and not defined
    under the said agreement or the Act, but is assigned a meaning to it in the
    notification issued under sub-section (3) and the notification issued thereunder
    being in force, then, the meaning assigned to such term shall be deemed to have
    effect from the date on which the said agreement came into force.
    Explanation 4.—For the removal of doubts, it is hereby declared that where any
    term used in an agreement entered into under sub-section (1) is defined under
    the said agreement, the said term shall have the same meaning as assigned to it
    in the agreement; and where the term is not defined in the said agreement, but
    defined in the Act, it shall have the same meaning as assigned to it in the Act and
    explanation, if any, given to it by the Central Government.
