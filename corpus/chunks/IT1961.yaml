- id: IT1961:s44AE(1)
  source_id: IT1961
  breadcrumb: Income-tax Act 1961 > s.44AE(1) > FY 2025-26 and earlier
  heading: Special provision for computing profits and gains of business of plying, hiring or leasing goods carriages
  text: |-
    44AE. (1) Notwithstanding anything to the contrary contained in sections 28
    to 43C, in the case of an assessee, who owns not more than ten goods
    carriages at any time during the previous year and who is engaged in the business
    of plying, hiring or leasing such goods carriages, the income of such business
    chargeable to tax under the head “Profits and gains of business or profession”
    shall be deemed to be the aggregate of the profits and gains, from all the goods
    carriages owned by him in the previous year, computed in accordance with the
    provisions of sub-section (2).
