    Explanation 3.—For the purposes of this sub-section, the expression “travel to
    any foreign country” does not include travel to the neighbouring countries or to
    such places of pilgrimage as the Board may specify in this behalf by notification
    in the Official Gazette.
    Explanation 4.—For the purposes of this section “beneficial owner” in respect of
    an asset means an individual who has provided, directly or indirectly, consider-
    ation for the asset for the immediate or future benefit, direct or indirect, of
    himself or any other person.
    Explanation 5.—For the purposes of this section “beneficiary” in respect of an
    asset means an individual who derives benefit from the asset during the previous
    year and the consideration for such asset has been provided by any person other
    than such beneficiary.
    Explanation 6.—For the purposes of this sub-section,—
    (a) “banking company” shall have the meaning assigned to it in clause (i)
    of the Explanation to section 269SS;
    (b) “co-operative bank” shall have the meaning assigned to it in clause (ii)
    of the Explanation to section 269SS.
