- id: IT1961:s234B(1)
  source_id: IT1961
  breadcrumb: Income-tax Act 1961 > s.234B(1) > FY 2025-26 and earlier
  heading: Interest for defaults in payment of advance tax
  text: |-
    234B. (1) Subject to the other provisions of this section, where, in any financial
    year, an assessee who is liable to pay advance tax under section 208 has
    failed to pay such tax or, where the advance tax paid by such assessee under the
    provisions of section 210 is less than ninety per cent of the assessed tax, the
    assessee shall be liable to pay simple interest at the rate of one per cent for every
    month or part of a month comprised in the period from the 1st day of April next
    following such financial year to the date of determination of total income under
    sub-section (1) of section 143 and where a regular assessment is made, to the date
    of such regular assessment, on an amount equal to the assessed tax or, as the case
    may be, on the amount by which the advance tax paid as aforesaid falls short of
    the assessed tax.
    Explanation 1.—In this section, “assessed tax”1 means the tax on the total income
    determined under sub-section (1) of section 143 and where a regular assessment
    is made, the tax on the total income determined under such regular assessment
    as reduced by the amount of,—
    (i) any tax deducted or collected at source in accordance with the
    provisions of Chapter XVII on any income which is subject to such
    deduction or collection and which is taken into account in computing
    such total income;
    (ia) any relief of tax allowed under section 89;
    (ii) any relief of tax allowed under section 90 on account of tax paid in a
    country outside India;
    (iii) any relief of tax allowed under section 90A on account of tax paid in
    a specified territory outside India referred to in that section;
    (iv) any deduction, from the Indian income-tax payable, allowed under
    section 91, on account of tax paid in a country outside India; and
    (v) any tax credit allowed to be set off in accordance with the provisions
    of section 115JAA or section 115JD.
    Explanation 2.—Where, in relation to an assessment year, an assessment is made
    for the first time under section 147 or section 153A, the assessment so made shall
    be regarded as a regular assessment for the purposes of this section.
    Explanation 3.—In Explanation 1 and in sub-section (3),—
    (i) “tax on total income as determined under sub-section (1) of section
    143” shall not include the additional income-tax, if any, payable under
    section 140B or section 143; and
    (ii) tax on the total income determined under such regular assessment
    shall not include the additional income-tax payable under section
    140B.
