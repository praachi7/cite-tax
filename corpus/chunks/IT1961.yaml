  heading: Tax on income of individuals, Hindu undivided family and others
  text: |-
    (5) Nothing contained in this section shall apply unless option is exercised in the
    prescribed manner by the person,—
    (i) having income from business or profession, on or before the due date
    specified under sub-section (1) of section 139 for furnishing the
    returns of income for any previous year relevant to the assessment
    year commencing on or after the 1st day of April, 2021, and such
    option once exercised shall apply to subsequent assessment years;
    (ii) having income other than the income referred to in clause (i),
    alongwith the return of income to be furnished under sub-section (1)
    of section 139 for a previous year relevant to the assessment year:
    Provided that the option under clause (i), once exercised for any previous year
    can be withdrawn only once for a previous year other than the year in which it
    was exercised and thereafter, the person shall never be eligible to exercise option
    under this section, except where such person ceases to have any income from
    business or profession in which case, option under clause (ii) shall be available:
    Provided further that the provisions of this sub-section shall not apply for any
    previous year relevant to the assessment year beginning on or after the 1st day
    of April, 2024.
