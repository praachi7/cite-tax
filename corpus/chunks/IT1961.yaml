- id: IT1961:s91(3)
  source_id: IT1961
  breadcrumb: Income-tax Act 1961 > s.91(3) > FY 2025-26 and earlier
  heading: Countries with which no agreement exists
  text: |-
    (3) If any non-resident person is assessed on his share in the income of a
    registered firm assessed as resident in India in any previous year and such share
    includes any income accruing or arising outside India during that previous year
    (and which is not deemed to accrue or arise in India) in a country with which
    there is no agreement under section 90 for the relief or avoidance of double
    taxation and he proves that he has paid income-tax by deduction or otherwise
    under the law in force in that country in respect of the income so included he shall
    be entitled to a deduction from the Indian income-tax payable by him of a sum
    calculated on such doubly taxed income so included at the Indian rate of tax or
    the rate of tax of the said country, whichever is the lower, or at the Indian rate
    of tax if both the rates are equal.
    Explanation.—In this section,—
    (i) the expression “Indian income-tax” means income-tax charged in
    accordance with the provisions of this Act;
    (ii) the expression “Indian rate of tax” means the rate determined by
    dividing the amount of Indian income-tax after deduction of any
    relief due under the provisions of this Act but before deduction of any
    relief due under this Chapter, by the total income;
    (iii) the expression “rate of tax of the said country” means income-tax and
    super-tax actually paid in the said country in accordance with the
    corresponding laws in force in the said country after deduction of all
    relief due, but before deduction of any relief due in the said country
    in respect of double taxation, divided by the whole amount of the
    income as assessed in the said country;
    (iv) the expression “income-tax” in relation to any country includes any
    excess profits tax or business profits tax charged on the profits by the
    Government of any part of that country or a local authority in that
    country.
    CHAPTER X
    SPECIAL PROVISIONS RELATING TO
    AVOIDANCE OF TAX
