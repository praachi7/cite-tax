- id: IT1961:s139(1)
  source_id: IT1961
  breadcrumb: Income-tax Act 1961 > s.139(1) > FY 2025-26 and earlier
  heading: Return of income
  text: |-
    139. (1) Every person,—
    (a) being a company or a firm; or
    (b) being a person other than a company or a firm, if his total income or
    the total income of any other person in respect of which he is
    assessable under this Act during the previous year exceeded the
    maximum amount which is not chargeable to income-tax,
    shall, on or before the due date, furnish a return of his income or the income
    of such other person during the previous year, in the prescribed form and
    verified in the prescribed manner and setting forth such other particulars as may
    be prescribed :
    Provided that a person referred to in clause (b), who is not required to furnish a
    return under this sub-section and residing in such area as may be specified by
    the Board in this behalf by notification in the Official Gazette, and who during
    the previous year incurs an expenditure of fifty thousand rupees or more
    towards consumption of electricity or at any time during the previous year fulfils
    any one of the following conditions, namely :—
    (i) is in occupation of an immovable property exceeding a specified floor
    area, whether by way of ownership, tenancy or otherwise, as may be
    specified by the Board in this behalf; or
    (ii) is the owner or the lessee of a motor vehicle other than a two-
    wheeled motor vehicle, whether having any detachable side car
    having extra wheel attached to such two-wheeled motor vehicle or
    not; or
    (iii) [***]
    (iv) has incurred expenditure for himself or any other person on travel to
    any foreign country; or
    (v) is the holder of a credit card, not being an “add-on” card, issued by any
    bank or institution; or
    (vi) is a member of a club where entrance fee charged is twenty-five
    thousand rupees or more,
    shall furnish a return, of his income during any previous year ending before the
    1st day of April, 2005, on or before the due date in the prescribed form and
    verified in the prescribed manner and setting forth such other particulars as may
    be prescribed :
    Provided further that the Central Government may, by notification in the Official
    Gazette, specify the class or classes of persons to whom the provisions of the first
    proviso shall not apply :
    Provided also that every company or a firm shall furnish on or before the
    due date the return in respect of its income or loss in every previous year :
    Provided also that a person, being a resident other than not ordinarily resident
    in India within the meaning of clause (6) of section 6, who is not required to
    furnish a return under this sub-section and who at any time during the previous
    year,—
    (a) holds, as a beneficial owner or otherwise, any asset (including any
    financial interest in any entity) located outside India or has signing
    authority in any account located outside India; or
    (b) is a beneficiary of any asset (including any financial interest in any
    entity) located outside India,
    shall furnish, on or before the due date, a return in respect of his income or loss
    for the previous year in such form and verified in such manner and setting forth
    such other particulars as may be prescribed:
    Provided also that nothing contained in the fourth proviso shall apply to an
    individual, being a beneficiary of any asset (including any financial interest in
    any entity) located outside India where, income, if any, arising from such asset
    is includible in the income of the person referred to in clause (a) of that proviso
    in accordance with the provisions of this Act:
    Provided also that every person, being an individual or a Hindu undivided family
    or an association of persons or a body of individuals, whether incorporated or
    not, or an artificial juridical person, if his total income or the total income of any
    other person in respect of which he is assessable under this Act during the
    previous year, without giving effect to the provisions of clause (38) of section 10
    or section 10A or section 10B or section 10BA or section 54 or section 54B or
    section 54D or section 54EC or section 54F or section 54G or section 54GA or
    section 54GB or Chapter VI-A exceeded the maximum amount which is not
    chargeable to income-tax, shall, on or before the due date, furnish a return of his
    income or the income of such other person during the previous year, in the
    prescribed form and verified in the prescribed manner and setting forth such
    other particulars as may be prescribed:
    Provided also that a person referred to in clause (b), who is not required to furnish
    a return under this sub-section, and who during the previous year—
    (i) has deposited an amount or aggregate of the amounts exceeding one
    crore rupees in one or more current accounts maintained with a
    banking company or a co-operative bank; or
    (ii) has incurred expenditure of an amount or aggregate of the amounts
    exceeding two lakh rupees for himself or any other person for travel
    to a foreign country; or
    (iii) has incurred expenditure of an amount or aggregate of the amounts
    exceeding one lakh rupees towards consumption of electricity; or
    (iv) fulfils such other conditions as may be prescribed,
    shall furnish a return of his income on or before the due date in such form and
    verified in such manner and setting forth such other particulars, as may be
    prescribed.
    Explanation 1.—For the purposes of this sub-section, the expression “motor
    vehicle” shall have the meaning assigned to it in clause (28) of section 2 of the
    Motor Vehicles Act, 1988 (59 of 1988).
