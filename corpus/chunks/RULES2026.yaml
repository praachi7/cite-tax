- id: RULES2026:r46(5)
  source_id: RULES2026
  breadcrumb: Income-tax Rules 2026 > r.46(5) > Tax Year 2026-27 onward
  heading: Maintenance of books of account under section 62
  text: |-
    (5) In this rule,—
    (a) "authorised representative" means a person who represents any other person, on payment of any fee or remuneration before—
    (i) any Tribunal; or
    (ii) any authority constituted or appointed by or under any law for the time being in force;
    but does not include an employee of the person so represented or a person carrying on legal profession or a person carrying on the profession of
    accountancy;
    (b) "cash book" means a record of all cash receipts and payments, kept and maintained day-to-day and giving the cash balance in hand at the end of each
    day or at the end of a specified period not exceeding a month;
    (c) "film artist" means any person engaged in his professional capacity in the production of a cinematograph film whether produced by him or by any
    other person, as—
    (i) an actor; or
    (ii) a cameraman; or
    (iii) a director, including an assistant director; or
    (iv) a music director, including an assistant music director; or
    (v) an art director, including an assistant art director; or
    (vi) a dance director, including an assistant dance director; or
    (vii) an editor; or
    (viii) a singer; or
    (ix) a lyricist; or
    (x) a story writer; or
    (xi) a screen-play writer; or
    (xii) a dialogue writer; or
    (xiii) a dress designer.
