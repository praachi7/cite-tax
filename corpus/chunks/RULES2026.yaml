- id: RULES2026:r46(4)
  source_id: RULES2026
  breadcrumb: Income-tax Rules 2026 > r.46(4) > Tax Year 2026-27 onward
  heading: Maintenance of books of account under section 62
  text: |-
    (4) The books of account and other documents referred to in sub-rule (2) shall be the following:—
    (a) a cash book; or
    (b) a journal, if the accounts are maintained according to the mercantile system of accounting; or
    (c) a ledger; or
    (d) for sums equal to or exceeding two hundred and fifty rupees, copies of bills or receipts issued by him; or
    (e) original bills and receipts in respect of expenditure equal to or exceeding two hundred and fifty rupees incurred by the person and issued to him; or
    (f) payment vouchers prepared and signed by the person, where the expenditure incurred does not exceed two hundred and fifty rupees, and the cash book
    maintained by the person does not contain adequate particulars in respect of such expenditure.
  tax_year_first: 2026
