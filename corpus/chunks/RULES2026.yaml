  breadcrumb: Income-tax Rules 2026 > r.76(1) > Tax Year 2026-27 onward
  heading: Foreign tax credit
  text: |-
    76. (1) An assessee, being a resident shall be allowed a credit for the amount of any foreign tax paid by him in a country or specified territory outside India, by
    way of deduction or otherwise, in the tax year in which the income corresponding to such tax has been offered to tax or assessed to tax in India, in the manner
    and to the extent as specified in this rule.
