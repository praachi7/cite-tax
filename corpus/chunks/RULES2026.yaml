- id: RULES2026:r76(7)
  source_id: RULES2026
  breadcrumb: Income-tax Rules 2026 > r.76(7) > Tax Year 2026-27 onward
  heading: Foreign tax credit
  text: |-
    (7) The credit of foreign tax shall be the aggregate of the amounts of credit computed separately for each source of income arising from a particular country or
    specified territory outside India and shall be given effect to in the following manner: —
    (a) the credit shall be the lower of the tax payable under the Act on such income and the foreign tax paid on such income, so, however, that where the
    foreign tax paid exceeds the amount of tax payable in accordance with the provisions of the agreement for relief or avoidance of double taxation, such
    excess shall be ignored;
    (b) the credit shall be determined by conversion of the currency of payment of foreign tax at the telegraphic transfer buying rate on the last day of the
    month immediately preceding the month in which such tax has been paid or deducted.
  tax_year_first: 2026
  tax_year_last: null
