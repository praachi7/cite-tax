- id: RULES2026:r164(6)
  source_id: RULES2026
  breadcrumb: Income-tax Rules 2026 > r.164(6) > Tax Year 2026-27 onward
  heading: Forms, eligibility, verification etc. in respect of return of income
  text: |-
    (6) A person shall not be eligible to file ITR-4, if he —
    (a) has assets (including financial interest in any entity) located outside India; or
    (b) has signing authority in any account located outside India; or
    (c) has income from any source outside India; or
    (d) has income to be apportioned in accordance with provisions of section 10; or
    (e) has claimed deduction under section 93, other than deduction claimed under section 93(1)(d) thereof; or
    (f) is a director in any company; or
    (g) has held any unlisted equity share at any time during the tax year; or
    (h) has total income, exceeding fifty lakh rupees; or
    (i) owns more than two house properties, the income of which is chargeable under the head "Income from house property"; or
    (j) has any brought forward loss or loss to be carried forward under any head of income; or
    (k) is assessable for the whole or any part of the income on which tax has been deducted at source in the hands of a person other than the assessee; or
    (l) has claimed any relief of tax under section 159 or deduction of tax under clause (d) of sub-section (1) of the said; or
    (m) has agricultural income, exceeding Rs. 5000; or
    (n) has income of the nature specified in section 17(1)(d) on which tax is payable or deductible under section 391(2) or section 392(3); or
    (o) has any income of the nature on which the tax is determinable as per provisions of Part A of Chapter XIII of the Act.
