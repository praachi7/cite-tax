  breadcrumb: Income-tax Rules 1962 > r.6F(4) > FY 2025-26 and earlier
  heading: Books of account and other documents to be kept and maintained under section 44AA(3) by persons carrying on certain professions
  text: |-
    (4) The books of account and other documents specified in sub-rule (2) and sub-rule (3) other than those relating to a previous year which has come to an end
    shall be kept and maintained by the person at the place where he is carrying on the profession or, where the profession is carried on in more places than one, at
    the principal place of his profession:
    Provided that where the person keeps and maintains separate books of account in respect of each place where the profession is carried on, such books of
    account and other documents may be kept and maintained at the respective places at which the profession is carried on.
