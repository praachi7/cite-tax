- id: RULES1962:r6F(1)
  source_id: RULES1962
  breadcrumb: Income-tax Rules 1962 > r.6F(1) > FY 2025-26 and earlier
  heading: Books of account and other documents to be kept and maintained under section 44AA(3) by persons carrying on certain professions
  text: |-
    6F. (1) Every person carrying on legal, medical, engineering or architectural profession or the profession of accountancy or technical consultancy or interior
    decoration or authorised representative or film artist shall keep and maintain the books of account and other documents specified in sub-rule (2) :
    Provided that nothing in this sub-rule shall apply in relation to any previous year in the case of any person if his total gross receipts in the profession do not
    exceed one lakh fifty thousand rupees in any one of the three years immediately preceding the previous year, or, where the profession has been newly set up in
    the previous year, his total gross receipts in the profession for that year are not likely to exceed the said amount.
