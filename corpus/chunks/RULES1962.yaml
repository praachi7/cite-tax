- id: RULES1962:r128(2)
  source_id: RULES1962
  breadcrumb: Income-tax Rules 1962 > r.128(2) > FY 2025-26 and earlier
  heading: Foreign Tax Credit
  text: |-
    (2) The foreign tax referred to in sub-rule (1) shall mean,—
    (a) in respect of a country or specified territory outside India with which India has entered into an agreement for the relief or avoidance of double taxation
    of income in terms of section 90 or section 90A, the tax covered under the said agreement;
    (b) in respect of any other country or specified territory outside India, the tax payable under the law in force in that country or specified territory in the
    nature of income-tax referred to in clause (iv) of the Explanation to section 91.
