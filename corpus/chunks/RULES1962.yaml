- id: RULES1962:r6F(5)
  source_id: RULES1962
  breadcrumb: Income-tax Rules 1962 > r.6F(5) > FY 2025-26 and earlier
  heading: Books of account and other documents to be kept and maintained under section 44AA(3) by persons carrying on certain professions
  text: |-
    (5) The books of account and other documents specified in sub-rule (2) and sub-rule (3) shall be kept and maintained for a period of six years from the end of
    the relevant assessment year:
    Provided that where the assessment in relation to any assessment year has been reopened under section 147 of the Act within the period specified in section
    149 of the Act, all the books of account and other documents which were kept and maintained at the time of reopening of the assessment shall continue to be
    so kept and maintained till the assessment so reopened has been completed.
