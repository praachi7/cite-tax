  text: |-
    (3) A person carrying on medical profession shall, in addition to the books of account and other documents specified in sub-rule (2), keep and maintain the
    following, namely :—
    (i) a daily case register in Form No. 3C;
    (ii) an inventory under broad heads, as on the first and the last day of the previous year, of the stock of drugs, medicines and other consumable accessories
    used for the purpose of his profession.
