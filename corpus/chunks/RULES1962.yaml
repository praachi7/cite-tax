- id: RULES1962:r128(5)
  source_id: RULES1962
  breadcrumb: Income-tax Rules 1962 > r.128(5) > FY 2025-26 and earlier
  heading: Foreign Tax Credit
  text: |-
    (5) The credit of foreign tax shall be the aggregate of the amounts of credit computed separately for each source of income arising from a particular country or
    specified territory outside India and shall be given effect to in the following manner:—
    (i) the credit shall be the lower of the tax payable under the Act on such income and the foreign tax paid on such income:
    Provided that where the foreign tax paid exceeds the amount of tax payable in accordance with the provisions of the agreement for relief or avoidance
    of double taxation, such excess shall be ignored for the purposes of this clause;
    (ii) the credit shall be determined by conversion of the currency of payment of foreign tax at the telegraphic transfer buying rate on the last day of the
    month immediately preceding the month in which such tax has been paid or deducted.
