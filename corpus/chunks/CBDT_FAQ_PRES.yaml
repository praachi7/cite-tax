  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q4 > Tax Year 2026-27 onward
  heading: Q4. Can an insurance agent adopt the presumptive taxation scheme of section 58(2)
  text: |-
    Q4. Can an insurance agent adopt the presumptive taxation scheme of section 58(2)
    [Table S. No. 1]?
    Ans: A person earning income in the nature of commission or brokerage is not eligible
    to opt for the presumptive taxation scheme under Section 58(2) [Table S. No. 1].
    Accordingly, insurance agents, whose income is generally earned by way of
    commission, cannot compute their income under the presumptive taxation scheme
    provided under this section.
    Relevant Content
    Section - 58
