- id: CBDT_FAQ_PRES:Q2
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q2 > Tax Year 2026-27 onward
  heading: Q2. Who is eligible to take advantage of the presumptive taxation scheme of section
  text: |-
    Q2. Who is eligible to take advantage of the presumptive taxation scheme of section
    58(2) [Table S. No. 1]?
    Ans: The presumptive taxation scheme under Section 58(2) [Table S. No. 1] may be
    opted for by the following eligible assessees:
    a) A resident Individual;
    b) A resident Hindu Undivided Family (HUF); and
    c) A resident Partnership Firm, other than a Limited Liability Partnership (LLP).
    Accordingly, the benefit of this scheme is not available to non-residents, LLPs,
    companies, trusts, co-operative societies, associations of persons (AOPs), bodies of
    individuals (BOIs), artificial juridical persons, or any other person not specifically
    covered within the definition of an eligible assessee.
    Further, the scheme is not available to an assessee who has claimed a deduction under
    Chapter VIII-C of the Income-tax Act, 2025, during the relevant tax year. It is also not
    available to a person carrying on a specified profession referred to in Section 62(4),
    carrying on any agency business, or earning income in the nature of commission or
    brokerage.
    Relevant Content
    Section - 58
