- id: CBDT_FAQ_PRES:Q22
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q22 > Tax Year 2026-27 onward
  heading: Q22. Can an assessee claim any further deduction from the presumptive income
  text: |-
    Q22. Can an assessee claim any further deduction from the presumptive income
    computed under Section 58(2) [Table S. No. 2]?
    Ans: No. Under the presumptive taxation scheme prescribed under Section 58(2)
    [Table S. No. 2], the income computed at the prescribed presumptive rates is deemed
    to have been arrived at after allowing all deductions admissible under the Income Tax
    Act, 2025. Accordingly, no further deduction shall be allowed in respect of any
    expenditure relating to such business.
    Further, depreciation on assets used in the business is also deemed to have been
    allowed. Therefore, while computing the written down value (WDV) of such assets, it
    shall be assumed that depreciation has been claimed and allowed for the relevant tax
    years.
    Since all eligible expenditures are deemed to have been allowed while determining
    the presumptive income, no separate disallowance of expenditure shall be made
    under the relevant provisions of the Act.
    Relevant Content
    Section - 58
