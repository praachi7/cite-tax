  heading: Q16. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
  text: |-
    Q16. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
    No. 3], then is he liable to pay advance tax in respect of income from profession
    covered under section 58(2) [Table S. No. 3]?
    Ans: An assessee opting for the presumptive taxation scheme under Section 58(2)
    [Table S. No. 3] is required to pay the entire amount of advance tax payable for the tax
    year on or before March 15 of that year. Unlike other taxpayers, who are generally
    required to pay advance tax in multiple instalments, an assessee covered under this
    scheme may discharge the whole of the advance tax liability in a single instalment by
    the prescribed due date.
    Relevant Content
    Section - 58
