- id: CBDT_FAQ_PRES:Q13
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q13 > Tax Year 2026-27 onward
  heading: Q13. Who is eligible to take advantage of the presumptive taxation scheme of
  text: |-
    Q13. Who is eligible to take advantage of the presumptive taxation scheme of
    section 58(2) [Table S. No. 3]?
    Ans: The presumptive taxation scheme under Section 58(2) [Table S. No. 3] can be
    opted for by a resident Individual or Partnership Firm (other than a Limited Liability
    Partnership) engaged in a specified profession. This scheme is available where the
    gross receipts from the profession do not exceed Rs. 50 lakh during the tax year.
    However, the threshold limit shall be enhanced to Rs. 75 lakh if the aggregate amount
    received in cash during the year does not exceed 5% of the total gross receipts.
    The following professions are eligible for the presumptive taxation scheme:
    1. Legal profession
    2. Medical profession
    3. Engineering profession
    4. Architectural profession
    5. Accountancy profession
    6. Technical consultancy
    7. Interior decoration
    8. Film artist
    9. Authorised representative
    10. Company secretary
    11. Information technology profession
    12. Any other profession as notified by CBDT
    The presumptive taxation scheme is not available to persons engaged in any
    profession other than those specified above.
    Relevant Content
    Section – 58
    Section – 62(4)
