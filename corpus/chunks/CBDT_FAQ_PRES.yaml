- id: CBDT_FAQ_PRES:Q5
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q5 > Tax Year 2026-27 onward
  heading: Q5. Can a person engage in a profession as prescribed under section 62(4) adopt the
  text: |-
    Q5. Can a person engage in a profession as prescribed under section 62(4) adopt the
    presumptive taxation scheme of section 58(2) [Table S. No. 1]?
    Ans: A person carrying on a specified profession referred to in Section 62(4) is not
    eligible to opt for the presumptive taxation scheme under Section 58(2) [Table S. No.
    1].
    However, such a person may be eligible to opt for the presumptive taxation scheme
    under Section 58(2) [Table S. No. 3], subject to the prescribed conditions. Under this
    scheme, income from the specified profession may be computed on a presumptive
    basis at the prescribed percentage of the gross receipts of the profession.
    The benefit of Section 58(2) [Table S. No. 3] is available only to a resident assessee
    engaged in a specified profession where the gross receipts of the profession do not
    exceed Rs. 50 lakh during the tax year. However, the threshold limit shall be increased
    to Rs. 75 lakh where the amount or aggregate amount of cash receipts during the tax
    year does not exceed 5% of the total gross receipts. For this purpose, receipts through
    a cheque or bank draft, which is not an account payee, shall be deemed to be cash
    receipts.
    Accordingly, a person carrying on a specified profession cannot avail the presumptive
    taxation scheme under Section 58(2) [Table S. No. 1] but may opt for the presumptive
    taxation scheme under Section 58(2) [Table S. No. 3], provided the gross receipts of
    the profession do not exceed Rs. 50 lakh or Rs. 75 lakh, as the case may be, and the
    other prescribed conditions are satisfied.
    Relevant Content
    Section - 58
