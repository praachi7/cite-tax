- id: CBDT_FAQ_PRES:Q24
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q24 > Tax Year 2026-27 onward
  heading: Q24. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
  text: |-
    Q24. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
    No. 2], then is he liable to pay advance tax in respect of income from business
    covered under section 58(2) [Table S. No. 2]?
    Ans: Yes. An assessee opting for the presumptive taxation scheme under Section 58(2)
    [Table S. No. 2] is liable to pay advance tax in respect of the income covered under the
    scheme.
    No special concession has been provided regarding the payment of advance tax for
    assessees opting for this presumptive taxation scheme. Accordingly, such assessees
    are required to comply with the advance tax provisions applicable under the Income
    Tax Act, 2025.
    Further, unlike assessees opting for the presumptive taxation schemes under Section
    58(2) [Table S. No. 1 and Table S. No. 3], assessees covered under Section 58(2) [Table
    S. No. 2] are required to pay advance tax in the prescribed instalments and are not
    permitted to discharge the entire advance tax liability in a single instalment on or
    before 15th March.
    Relevant Content
    Section - 58
