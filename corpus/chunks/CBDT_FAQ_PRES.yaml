- id: CBDT_FAQ_PRES:Q21
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q21 > Tax Year 2026-27 onward
  heading: Q21. Can a person who owns more than 10 goods vehicles adopt the presumptive
  text: |-
    Q21. Can a person who owns more than 10 goods vehicles adopt the presumptive
    taxation scheme of section 58(2) [Table S. No. 2]?
    Ans: The presumptive taxation scheme under Section 58(2) [Table S. No. 2] may be
    opted for by a person engaged in the business of plying, hiring or leasing goods
    carriages, provided that such person does not own more than ten goods carriage
    vehicles at any time during the tax year.
    The ownership condition is a key eligibility requirement of the scheme. Accordingly ,
    if a person owns more than ten goods carriage vehicles at any time during the tax year,
    he shall not be eligible to compute income under the presumptive taxation scheme
    prescribed under Section 58(2) [Table S. No. 2].
    Relevant Content
    Section - 58
