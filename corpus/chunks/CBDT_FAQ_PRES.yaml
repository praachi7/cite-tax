- id: CBDT_FAQ_PRES:Q6
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q6 > Tax Year 2026-27 onward
  heading: Q6. Can a person whose total turnover or gross receipts for the year exceed
  text: |-
    Q6. Can a person whose total turnover or gross receipts for the year exceed
    threshold limit adopt the presumptive taxation scheme of section 58(2) [Table S. No.
    1]?
    Ans: The presumptive taxation scheme under Section 58(2) [Table S. No. 1] may be
    opted for by an eligible assessee carrying on an eligible business, provided the total
    turnover or gross receipts of such business do not exceed the prescribed threshold
    limit during the tax year.
    The threshold limit is Rs. 2 crore. However, the limit shall be increased to Rs. 3 crore
    where the amount or aggregate amount of cash receipts during the tax year does not
    exceed 5% of the total turnover or gross receipts. For this purpose, receipts through a
    cheque or bank draft which is not an account payee shall be deemed to be cash
    receipts.
    Accordingly, where the total turnover or gross receipts of the eligible business exceed
    Rs. 2 crore or Rs. 3 crore, as the case may be, the assessee shall not be eligible to opt
    for the presumptive taxation scheme under Section 58(2) [Table S. No. 1], and the
    income shall be computed in accordance with the normal provisions of the Act.
    Relevant Content
    Section - 58
