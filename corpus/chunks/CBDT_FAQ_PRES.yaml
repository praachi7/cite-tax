- id: CBDT_FAQ_PRES:Q15
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q15 > Tax Year 2026-27 onward
  heading: Q15. Can a person who adopts the presumptive taxation scheme of section 58(2)
  text: |-
    Q15. Can a person who adopts the presumptive taxation scheme of section 58(2)
    [Table S. No. 3] claim any further deduction of expenses after declaring profit @
    50% of gross receipts?
    Ans: No, any loss, allowance, or deduction allowable under the provisions of this Act
    shall not be allowed against the income computed in the manner specified in Section
    58(2) [Table S. No. 3].
    Accordingly, where an assessee engaged in a specified profession opts for the
    presumptive taxation scheme under Section 58(2) [Table S. No. 3] and declares income
    at 50% of the gross receipts, no further deduction in respect of expenses otherwise
    allowable under Sections 30 to 38 can be claimed.
    Further, for the purposes of computing the written down value (WDV) of any asset
    used in the profession, depreciation shall be deemed to have been allowed and the
    WDV shall be calculated accordingly, irrespective of whether such depreciation has
    actually been claimed.
    Relevant Content
    Section - 58
