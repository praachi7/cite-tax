- id: CBDT_FAQ_PRES:Q18
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q18 > Tax Year 2026-27 onward
  heading: Q18. What provision will apply if a person opts for the presumptive taxation
  text: |-
    Q18. What provision will apply if a person opts for the presumptive taxation
    scheme of section 58(2) [Table S. No. 3] and declares his income from profession at
    lower rate (i.e. less than 50%)?
    Ans: An assessee opting for the presumptive taxation scheme under Section 58(2)
    [Table S. No. 3] is not required to maintain books of account in respect of the specified
    profession as prescribed under Section 62. Accordingly, where an eligible assessee
    computes income on a presumptive basis and declares income at 50% or more of the
    gross receipts from the specified profession, the provisions relating to maintenance of
    books of account shall not apply.
    However, if the assessee claims that the profits and gains from the profession are
    lower than 50% of the gross receipts and his total income exceeds the maximum
    amount not chargeable to tax, he shall be required to maintain books of account in
    accordance with Section 62 and comply with the applicable audit requirements under
    Section 63.
