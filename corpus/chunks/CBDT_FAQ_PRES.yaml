  heading: Q1. What is the meaning of presumptive taxation scheme?
  text: |-
    Q1. What is the meaning of presumptive taxation scheme?
    Ans: As per section 62 of the Income-tax Act, 2025, a person engaged in business or
    profession is required to maintain regular books of account under certain
    circumstances. To give relief to small taxpayers from this tedious work, the Income -
    tax Act has framed the presumptive taxation scheme under sections 58 and 61.
    A person adopting the presumptive taxation scheme can declare income at a
    prescribed rate and, in turn, is relieved from the tedious job of maintaining books of
    account.
    Presumptive Scheme for Resident
    a) Presumptive Taxation Scheme for Businesses under Section58(2) [Table S. No. 1]
    b) Presumptive Taxation Scheme for Professions under Section 58(2) [Table S. No. 3]
    c) Presumptive Taxation Scheme for Goods Transport Agency under Section 58(2)
    [Table S. No. 2]
    Presumptive Scheme for Non-Residents
    a) Presumptive Taxation Scheme for Goods Transport Agency under Section 58(2)
    [Table S. No. 2]
    b) Presumptive Taxation Scheme for Shipping Businesses under Section 61(2) [Table
    S. No. 1]
    c) Presumptive Taxation Scheme for Exploration Business under Section 61(2) [Table
    S. No. 5]
    d) Presumptive Taxation Scheme for Airline Cos. under Section 61(2) [Table S. No. 3]
    e) Presumptive Taxation Scheme for Civil Construction Cos. under Section 61(2)
    [Table S. No. 4]
    f) Presumptive Taxation Scheme for Cruise Shipping Businesses under Section 61(2)
    [Table S. No. 2]
    g) Presumptive Taxation Scheme for providing services or technology for setting up
    electronics manufacturing facilities in India under Section 61(2) [Table S. No. 6]
    Relevant Content
    Section - 58
    Section - 62
