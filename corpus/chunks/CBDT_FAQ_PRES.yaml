- id: CBDT_FAQ_PRES:Q20
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q20 > Tax Year 2026-27 onward
  heading: Q20. Who is eligible to take advantage of the presumptive taxation scheme of
  text: |-
    Q20. Who is eligible to take advantage of the presumptive taxation scheme of
    section 58(2) [Table S. No. 2] and which business is eligible for the presumptive
    taxation scheme of section 58(2) [Table S. No. 2]?
    Ans: The presumptive taxation scheme under Section 58(2) [Table S. No. 2] is available
    to any person engaged in the business of plying, hiring or leasing goods carriages,
    irrespective of the nature of the person, such as an individual, Hindu Undivided
    Family (HUF), firm, company or any other person. However, the scheme can be opted
    for only if the person does not own more than ten goods carriage vehicles at any time
    during the tax year.
