- id: CBDT_FAQ_PRES:Q11
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q11 > Tax Year 2026-27 onward
  heading: Q11. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
  text: |-
    Q11. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
    No. 1], then is he liable to pay advance tax in respect of income from business
    covered under section 58(2) [Table S. No. 1]?
    Ans: An assessee opting for the presumptive taxation scheme under Section 58(2)
    [Table S. No. 1] is liable to pay advance tax in accordance with the provisions of the
    Income-tax Act, 2025.
    However, unlike other taxpayers who are required to pay advance tax in multiple
    instalments during the tax year, an assessee covered by this presumptive taxation
    scheme may discharge the entire advance tax liability in a single instalment on or
    before 15th March of the relevant tax year.
    If the assessee fails to pay the whole of the advance tax by 15th March, interest may
    be leviable in accordance with the applicable provisions relating to default or
    deferment of advance tax.
    Further, any amount paid towards advance tax on or before 31st March of the tax year
    shall be treated as advance tax paid during that tax year.
    Relevant Content
    Section - 58
