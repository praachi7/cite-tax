- id: CBDT_FAQ_PRES:Q23
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q23 > Tax Year 2026-27 onward
  heading: Q23. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
  text: |-
    Q23. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
    No. 2] , then is he required to maintain books of account as per section 62?
    Ans: No, An assessee opting for the presumptive taxation scheme under Section 58(2)
    [Table S. No. 2] is not required to maintain books of account in respect of the business
    covered by the scheme.
    Section 62 of the Income Tax Act, 2025 contains provisions relating to the maintenance
    of books of account. However, an assessee who computes income in accordance with
    the presumptive taxation scheme under Section 58(2) [Table S. No. 2] is exempt from
    the requirement of maintaining books of account for such business.
    Accordingly, where an eligible assessee engaged in the business of plying, hiring or
    leasing goods carriages declares income at the prescribed presumptive rates under
    Section 58(2) [Table S. No. 2], the provisions relating to maintenance of books of
    account under Section 62 shall not apply in respect of that business.
    Relevant Content
    Section – 58
    Section - 62
