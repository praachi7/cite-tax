- id: CBDT_FAQ_PRES:Q9
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q9 > Tax Year 2026-27 onward
  heading: Q9. As per the presumptive taxation scheme of section 58(2) [Table S. No. 1], income
  text: |-
    Q9. As per the presumptive taxation scheme of section 58(2) [Table S. No. 1], income
    of a taxpayer will be computed @ 8%/6% of the turnover or gross receipt and from
    such income can the taxpayer claim any further deductions?
    Ans: No. Under the presumptive taxation scheme provided in Section 58(2) [Table S.
    No. 1], the income computed at the prescribed rate of 6% or 8% of the turnover or
    gross receipts is deemed to be the profits and gains of the eligible business.
    Any loss, allowance, or deduction allowable under the provisions of this Act shall not
    be allowed against the income computed in the manner specified in Section 58(2)
    [Table S. No. 1].
    Thus, the presumptive income computed under Section 58(2) [Table S. No. 1] is treated
    as the final taxable income from the eligible business.
    Further, for the purpose of determining the written down value (WDV) of any
    depreciable asset, depreciation shall be deemed to have been allowed and the WDV
    shall be computed accordingly, irrespective of whether such depreciation has actually
    been claimed.
    Relevant Content
    Section - 58
