  heading: Q7. What is the manner of computation of taxable business income under the
  text: |-
    Q7. What is the manner of computation of taxable business income under the
    normal provisions of the Income-tax Law, i.e., in case of a person not adopting the
    presumptive taxation scheme of section 58(2) [Table S. No. 1]?
    Ans: Generally, as per the Income-tax Law, the taxable business income of every
    person is computed as follows :
    Particulars Amount
    Turnover or gross receipts from the business XXXXX
    Less : Expenses incurred in relation to earning of the income (XXXXX)
    Taxable Business Income XXXXX
    For the purpose of computing taxable business income in the above manner, the
    taxpayers have to maintain books of account of the business and income will be
    computed on the basis of the information revealed in the books of account.
    Relevant Content
    Section - 58
