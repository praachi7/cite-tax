- id: CBDT_FAQ_PRES:Q10
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q10 > Tax Year 2026-27 onward
  heading: Q10. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
  text: |-
    Q10. If a person adopts the presumptive taxation scheme of section 58(2) [Table S.
    No. 1], then is he required to maintain books of account as per section 62?
    Ans: Section 62 of the Income-tax Act, 2025 prescribes the circumstances in which a
    person carrying on a business or profession is required to maintain books of account
    and other prescribed records.
    However, where an eligible assessee opts for the presumptive taxation scheme under
    Section 58(2) [Table S. No. 1] and computes income at the prescribed presumptive rate
    of 6% or 8% of the turnover or gross receipts, the provisions relating to maintenance
    of books of account under Section 62 shall not apply in respect of the eligible business
    covered by the scheme.
    Accordingly, an assessee who validly opts for the presumptive taxation scheme under
    Section 58(2) [Table S. No. 1] is not required to maintain books of account for such
    business, provided the conditions prescribed under the scheme are satisfied.
    Relevant Content
    Section - 62
    Section - 58
