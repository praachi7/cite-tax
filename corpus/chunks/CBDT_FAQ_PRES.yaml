- id: CBDT_FAQ_PRES:Q3
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q3 > Tax Year 2026-27 onward
  heading: Q3. Which businesses are not eligible for the presumptive taxation scheme of
  text: |-
    Q3. Which businesses are not eligible for the presumptive taxation scheme of
    section 58(2) [Table S. No. 1]?
    Ans: The presumptive taxation scheme under Section 58(2) [Table S. No. 1] is
    intended to provide relief to small taxpayers engaged in eligible businesses by
    simplifying the computation of taxable income and reducing compliance
    requirements.
    The scheme is available in respect of any business carried on by an eligible assessee,
    except the following:
    • A business of plying, hiring, or leasing goods carriages, which is covered under
    Section 58(2) [Table S. No. 2];
    • Any agency business;
    • Any business earning income in the nature of commission or brokerage; and
    • A specified profession referred to in Section 62(4).
    Further, the benefit of the scheme is available only where the total turnover or gross
    receipts of the eligible business do not exceed Rs. 2 crore during the tax year.
    However, the threshold limit shall be increased to Rs. 3 crore where the amount or
    aggregate amount of cash receipts during the tax year does not exceed 5% of the total
    turnover or gross receipts. For this purpose, receipts through a cheque or bank draft
    which is not an account payee shall be deemed to be cash receipts.
    Accordingly, a person carrying on a specified profession, an agency business, or a
    business earning income in the nature of commission or brokerage is not eligible to
    opt for the presumptive taxation scheme under Section 58(2) [Table S. No. 1].
    Relevant Content
    Section - 58
