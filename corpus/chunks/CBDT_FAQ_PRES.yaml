- id: CBDT_FAQ_PRES:Q8
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q8 > Tax Year 2026-27 onward
  heading: Q8. What is the manner of computation of taxable business income in case of a
  text: |-
    Q8. What is the manner of computation of taxable business income in case of a
    person adopting the presumptive taxation scheme of section 58(2) [Table S. No. 1]?
    Ans: Under Section 58(2) [Table S. No. 1], the income of an eligible business is
    computed on a presumptive basis rather than in accordance with the normal
    provisions relating to computation of business income.
    The presumptive income shall be deemed to be:
    • 8% of the turnover or gross receipts received in cash or through modes other
    than the prescribed modes; and
    • 6% of the turnover or gross receipts which is received by specified banking or
    online mode.
    The concessional rate of 6% shall apply in respect of receipts received during the tax
    year or on or before the due date for furnishing the return of income.
    Accordingly, an assessee opting for the presumptive taxation scheme is not required
    to compute taxable profits in the normal manner by deducting business expenditure
    from business receipts. Instead, the income is deemed to be 6% or 8% of the turnover
    or gross receipts, as applicable.
    The assessee may, however, voluntarily declare income at a rate higher than the
    prescribed presumptive rate if the actual profits of the business exceed such rate.
    Relevant Content
    Section - 58
