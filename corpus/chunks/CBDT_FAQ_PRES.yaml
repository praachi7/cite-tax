- id: CBDT_FAQ_PRES:Q12
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q12 > Tax Year 2026-27 onward
  heading: Q12. If a person adopts the presumptive taxation scheme but he opts out from the
  text: |-
    Q12. If a person adopts the presumptive taxation scheme but he opts out from the
    scheme in any of the subsequent five years, then what are the consequences?
    Ans: If an eligible assessee opts for the presumptive taxation scheme under Section
    58(2) [Table S. No. 1] and subsequently declares income lower than the prescribed
    presumptive rate in any of the next five consecutive tax years, the assessee shall
    become ineligible to avail the benefit of the presumptive taxation scheme for the next
    five tax years following the year in which such lower income is declared.
    For example, a partnership firm opts for the presumptive taxation scheme in Tax Year
    2026-27 and computes its income in accordance with Section 58(2) [Table S. No. 1]. The
    firm continues to offer income on a presumptive basis for Tax Years 2027-28 and 2028-
    29. However, in Tax Year 2029-30, it declares income at a rate lower than the
    prescribed presumptive rate.
    Since the firm has failed to compute and offer income in accordance with the
    provisions of Section 58(2) [Table S. No. 1] during the prescribed five -year period, it
    shall not be eligible to opt for the presumptive taxation scheme for the subsequent five
    tax years, i.e., from Tax Year 2030-31 to Tax Year 2034-35.
    Further, for the year in which lower income is declared and for the period during
    which the assessee is barred from availing the scheme, the assessee may be required
    to maintain books of account under Section 62 and get them audited under Section 63,
    subject to the conditions prescribed under the Act.
    Relevant Content
    Section - 58
