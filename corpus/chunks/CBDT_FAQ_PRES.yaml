- id: CBDT_FAQ_PRES:Q14
  source_id: CBDT_FAQ_PRES
  breadcrumb: CBDT FAQs on presumptive taxation (2025 Act) > Q14 > Tax Year 2026-27 onward
  heading: Q14. What is the manner of computation of taxable income in case of a person
  text: |-
    Q14. What is the manner of computation of taxable income in case of a person
    adopting the presumptive taxation scheme of section 58(2) [Table S. No. 3]?
    Ans: Where an eligible assessee opts for the presumptive taxation scheme under
    Section 58(2) [Table S. No. 3], the income from the specified profession shall be
    deemed to be 50% of the total gross receipts of the tax year. This scheme is available
    where the gross receipts from the profession do not exceed Rs. 50 lakh during the tax
    year. However, the threshold limit shall be increased to Rs. 75 lakh if the aggregate
    amount received in cash during the year does not exceed 5% of the total gross receipts.
    Receipts through a cheque or bank draft that is not account payee shall be treated as
    cash receipts for this purpose.
    Under this scheme, the income of the assessee is not required to be computed in the
    normal manner after claiming individual expenses. Instead, 50% of the gross receipts
    from the specified profession is deemed to be the taxable income of the year. However,
    the assessee is free to declare a higher income than the prescribed presumptive
    income.
    Relevant Content
    Section - 58
