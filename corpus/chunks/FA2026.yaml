- id: FA2026:sch1-partIA-paraA(I)
  source_id: FA2026
  breadcrumb: Finance Act 2026 > First Schedule Part I-A Paragraph A(I) > FY 2025-26
  heading: Old-regime income-tax rates for individuals below 60 (1961 Act, AY 2026-27)
  text: |-
    First Schedule, Part I, A. Income-tax under the Income-tax Act, 1961. Paragraph A, item (I): every individual other than those in items (II) and (III) [senior and very senior citizens], Hindu undivided family, association of persons, body of individuals or artificial juridical person, not being a case to which Paragraphs B to E apply.
    Rates of income-tax:
    (1) where the total income does not exceed Rs. 2,50,000: Nil;
    (2) where the total income exceeds Rs. 2,50,000 but does not exceed Rs. 5,00,000: 5 per cent of the amount by which the total income exceeds Rs. 2,50,000;
    (3) where the total income exceeds Rs. 5,00,000 but does not exceed Rs. 10,00,000: Rs. 12,500 plus 20 per cent of the amount by which the total income exceeds Rs. 5,00,000;
    (4) where the total income exceeds Rs. 10,00,000: Rs. 1,12,500 plus 30 per cent of the amount by which the total income exceeds Rs. 10,00,000.
    These are the rates when the person has opted out of the new regime (s.115BAC). New-regime slabs are in s.115BAC(1A) of the 1961 Act.
  tax_year_first: 2025
  tax_year_last: 2025
  authority_rank: 1
  pdf_pages:
  - 106
  cross_refs:
  - IT1961:s115BAC(1A)
  is_table: true
  extraction: hand_typed
- id: FA2026:sch1-partIB-paraA(I)
  source_id: FA2026
  breadcrumb: Finance Act 2026 > First Schedule Part I-B Paragraph A(I) > Tax Year 2026-27
  heading: Old-regime income-tax rates for individuals below 60 (2025 Act, Tax Year 2026-27)
  text: |-
    First Schedule, Part I, B. Income-tax under the Income-tax Act, 2025. Paragraph A, item (I): every individual other than those in items (II) and (III) [senior and very senior citizens], Hindu undivided family, association of persons, body of individuals or artificial juridical person, not being a case to which Paragraphs B to E apply.
    Rates of income-tax:
    (1) where the total income does not exceed ₹250000: Nil;
    (2) where the total income exceeds ₹250000 but does not exceed ₹500000: 5% of the amount by which the total income exceeds ₹250000;
    (3) where the total income exceeds ₹500000 but does not exceed ₹1000000: ₹12500 plus 20% of the amount by which the total income exceeds ₹500000;
    (4) where the total income exceeds ₹1000000: ₹112500 plus 30% of the amount by which the total income exceeds ₹1000000.
    These are the rates when the person has opted out of the new regime (s.202(4)). New-regime slabs are in s.202(1) of the 2025 Act.
  tax_year_first: 2026
  tax_year_last: 2026
