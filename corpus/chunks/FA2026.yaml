- id: FA2026:sch1-partIA-paraF/T1
  source_id: FA2026
  covers:
  - FA2026:sch1-partIA-paraF/T1(1)
  breadcrumb: Finance Act 2026 > First Schedule Part I-A Paragraph F Table 1 Sl. 1 > FY 2025-26
  heading: Surcharge on income-tax for individuals (1961 Act, AY 2026-27)
  text: |-
    First Schedule, Part I-A, Paragraph F (Surcharge on income-tax). The income-tax computed under Paragraphs A to E, or sections 111A, 112 or 112A of the Income-tax Act, 1961, for a person in column B of Table 1 is increased by a surcharge at the rates in column C.
    Table 1, Sl. No. 1. Person: (i) every individual; (ii) Hindu undivided family; (iii) association of persons (other than one consisting only of companies); (iv) body of individuals; (v) every artificial juridical person.
    Rate of surcharge:
    (i) total income (including dividend income or capital gains under sections 111A, 112 and 112A) exceeds Rs. 50,00,000 but does not exceed Rs. 1,00,00,000: 10 per cent;
    (ii) total income (including such income) exceeds Rs. 1,00,00,000 but does not exceed Rs. 2,00,00,000: 15 per cent;
    (iii) total income (excluding such income) exceeds Rs. 2,00,00,000 but does not exceed Rs. 5,00,00,000: 25 per cent;
    (iv) total income (excluding such income) exceeds Rs. 5,00,00,000: 37 per cent;
    (v) total income (including such income) exceeds Rs. 2,00,00,000 but is not covered in (iii) and (iv): 15 per cent;
    (vi) surcharge on the tax on dividend income or capital gains under sections 111A, 112 and 112A shall not exceed 15 per cent.
  tax_year_first: 2025
  tax_year_last: 2025
  authority_rank: 1
  pdf_pages:
