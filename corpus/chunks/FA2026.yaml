  text: |-
    First Schedule, Part I-B, Paragraph F (Surcharge on income-tax). The income-tax computed under Paragraphs A to E, or sections 196, 197 or 198 of the Income-tax Act, 2025, for a person in column B of Table 1 is increased by a surcharge at the rates in column C.
    Table 1, Sl. No. 1. Person: (i) every individual; (ii) Hindu undivided family; (iii) association of persons (other than one consisting only of companies); (iv) body of individuals; (v) every artificial juridical person.
    Rate of surcharge:
    (i) total income (including dividend income or capital gains under sections 196, 197 and 198) exceeds ₹5000000 but does not exceed ₹10000000: 10%;
    (ii) total income (including such income) exceeds ₹10000000 but does not exceed ₹20000000: 15%;
    (iii) total income (excluding such income) exceeds ₹20000000 but does not exceed ₹50000000: 25%;
    (iv) total income (excluding such income) exceeds ₹50000000: 37%;
    (v) total income (including such income) exceeds ₹20000000 but is not covered in (iii) and (iv): 15%;
    (vi) surcharge on the tax on dividend income or capital gains under sections 196, 197 and 198 shall not exceed 15%.
